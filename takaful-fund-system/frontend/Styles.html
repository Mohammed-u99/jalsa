<style>
/* ===== المتغيرات ===== */
:root {
  --primary: #1a73e8;
  --primary-dark: #1557b0;
  --primary-light: #e8f0fe;
  --success: #0d904f;
  --success-light: #e6f4ea;
  --warning: #e37400;
  --warning-light: #fef7e0;
  --danger: #d93025;
  --danger-light: #fce8e6;
  --info: #1967d2;
  --info-light: #e8f0fe;
  --gray-50: #f8f9fa;
  --gray-100: #f1f3f4;
  --gray-200: #e8eaed;
  --gray-300: #dadce0;
  --gray-400: #bdc1c6;
  --gray-500: #9aa0a6;
  --gray-600: #80868b;
  --gray-700: #5f6368;
  --gray-800: #3c4043;
  --gray-900: #202124;
  --white: #ffffff;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.1);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.12);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.15);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
}

/* ===== الأساسيات ===== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 15px;
  direction: rtl;
}

body {
  font-family: var(--font-family);
  background: var(--gray-50);
  color: var(--gray-900);
  line-height: 1.6;
  min-height: 100vh;
}

/* ===== الرأس والتنقل ===== */
.app-header {
  background: var(--primary);
  color: var(--white);
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-md);
}

.header-content {
  display: flex;
  align-items: center;
  gap: 24px;
  max-width: 1400px;
  margin: 0 auto;
  height: 60px;
}

.app-title {
  font-size: 1.3rem;
  font-weight: 700;
  white-space: nowrap;
}

.main-nav {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  flex: 1;
}

.nav-btn {
  background: transparent;
  color: rgba(255,255,255,0.8);
  border: none;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-family: var(--font-family);
  font-size: 0.9rem;
  font-weight: 500;
  white-space: nowrap;
  transition: all 0.2s;
}

.nav-btn:hover {
  background: rgba(255,255,255,0.15);
  color: var(--white);
}

.nav-btn.active {
  background: rgba(255,255,255,0.25);
  color: var(--white);
  font-weight: 700;
}

.nav-toggle {
  display: none;
  background: transparent;
  color: var(--white);
  border: none;
  font-size: 1.5rem;
  cursor: pointer;
  padding: 4px 8px;
}

/* ===== المحتوى الرئيسي ===== */
.app-main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px;
  position: relative;
}

/* ===== الشاشات ===== */
.view {
  display: none;
}

.view.active {
  display: block;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.view-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

.view-header h2 {
  font-size: 1.5rem;
  color: var(--gray-900);
}

.view-description {
  color: var(--gray-600);
  margin-bottom: 16px;
  padding: 12px 16px;
  background: var(--info-light);
  border-radius: var(--radius-sm);
  border-right: 4px solid var(--info);
}

/* ===== البطاقات ===== */
.summary-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.card {
  background: var(--white);
  border-radius: var(--radius-md);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 16px;
  border-top: 4px solid var(--gray-300);
  transition: transform 0.2s, box-shadow 0.2s;
}

.card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.card-primary { border-top-color: var(--primary); }
.card-success { border-top-color: var(--success); }
.card-warning { border-top-color: var(--warning); }
.card-info { border-top-color: var(--info); }
.card-danger { border-top-color: var(--danger); }

.card-icon {
  font-size: 2rem;
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card-body {
  flex: 1;
}

.card-label {
  font-size: 0.8rem;
  color: var(--gray-600);
  margin-bottom: 4px;
  font-weight: 500;
}

.card-value {
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--gray-900);
  line-height: 1.2;
}

.card-unit {
  font-size: 0.75rem;
  color: var(--gray-500);
  margin-top: 2px;
}

/* ===== اللوحات ===== */
.panel {
  background: var(--white);
  border-radius: var(--radius-md);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 20px;
}

.panel h3 {
  font-size: 1.1rem;
  margin-bottom: 16px;
  color: var(--gray-800);
  padding-bottom: 8px;
  border-bottom: 2px solid var(--gray-100);
}

.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
  gap: 20px;
}

/* ===== الجداول ===== */
.table-wrapper {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
}

thead th {
  background: var(--gray-50);
  color: var(--gray-700);
  font-weight: 600;
  text-align: right;
  padding: 12px 16px;
  border-bottom: 2px solid var(--gray-200);
  white-space: nowrap;
}

tbody td {
  padding: 10px 16px;
  border-bottom: 1px solid var(--gray-100);
  color: var(--gray-800);
}

tbody tr:hover {
  background: var(--gray-50);
}

tbody tr:last-child td {
  border-bottom: none;
}

.amount-positive {
  color: var(--success);
  font-weight: 600;
}

.amount-negative {
  color: var(--danger);
  font-weight: 600;
}

.status-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
}

.status-active {
  background: var(--success-light);
  color: var(--success);
}

.status-inactive {
  background: var(--warning-light);
  color: var(--warning);
}

.status-closed {
  background: var(--gray-100);
  color: var(--gray-600);
}

/* ===== الأزرار ===== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 20px;
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font-family);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}

.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--primary);
  color: var(--white);
}
.btn-primary:hover:not(:disabled) {
  background: var(--primary-dark);
}

.btn-secondary {
  background: var(--gray-200);
  color: var(--gray-800);
}
.btn-secondary:hover:not(:disabled) {
  background: var(--gray-300);
}

.btn-success {
  background: var(--success);
  color: var(--white);
}
.btn-success:hover:not(:disabled) {
  background: #0b7b43;
}

.btn-info {
  background: var(--info);
  color: var(--white);
}
.btn-info:hover:not(:disabled) {
  background: #1557b0;
}

.btn-danger {
  background: var(--danger);
  color: var(--white);
}
.btn-danger:hover:not(:disabled) {
  background: #b3261e;
}

.btn-sm {
  padding: 4px 12px;
  font-size: 0.8rem;
}

.btn-icon {
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  font-size: 1rem;
  transition: background 0.2s;
}

.btn-icon:hover {
  background: var(--gray-100);
}

/* ===== النماذج ===== */
.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  margin-bottom: 6px;
  font-weight: 600;
  font-size: 0.85rem;
  color: var(--gray-700);
}

.form-group small {
  display: block;
  margin-top: 4px;
  color: var(--gray-500);
  font-size: 0.75rem;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--gray-300);
  border-radius: var(--radius-sm);
  font-family: var(--font-family);
  font-size: 0.9rem;
  color: var(--gray-900);
  background: var(--white);
  transition: border-color 0.2s, box-shadow 0.2s;
  direction: rtl;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
}

.form-group textarea {
  resize: vertical;
}

.form-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
  justify-content: flex-start;
}

.inline-form {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.inline-form input {
  flex: 1;
  padding: 8px 14px;
  border: 1.5px solid var(--gray-300);
  border-radius: var(--radius-sm);
  font-family: var(--font-family);
  font-size: 0.9rem;
}

.inline-form input:focus {
  outline: none;
  border-color: var(--primary);
}

/* ===== النوافذ المنبثقة ===== */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn 0.2s ease;
}

.modal-content {
  background: var(--white);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
}

.modal-lg {
  max-width: 800px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 24px;
  border-bottom: 1px solid var(--gray-200);
  position: sticky;
  top: 0;
  background: var(--white);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  z-index: 1;
}

.modal-header h3 {
  font-size: 1.2rem;
  color: var(--gray-900);
}

.modal-close {
  background: transparent;
  border: none;
  font-size: 1.5rem;
  cursor: pointer;
  color: var(--gray-600);
  padding: 0 4px;
  line-height: 1;
}

.modal-close:hover {
  color: var(--gray-900);
}

.modal-content form,
.modal-content > div:not(.modal-header) {
  padding: 24px;
}

/* ===== القوائم ===== */
.tag-list {
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.tag-list li {
  background: var(--gray-100);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.85rem;
  color: var(--gray-700);
}

/* ===== التقارير ===== */
.report-filters {
  display: flex;
  gap: 16px;
  align-items: flex-end;
  flex-wrap: wrap;
  margin-bottom: 24px;
  padding: 20px;
  background: var(--white);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
}

.report-filters .form-group {
  margin-bottom: 0;
}

.report-actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.report-summary {
  margin-bottom: 24px;
}

/* ===== الإعدادات ===== */
.settings-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
  gap: 20px;
}

/* ===== الإشعارات ===== */
#toast-container {
  position: fixed;
  top: 72px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 300;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.toast {
  background: var(--gray-900);
  color: var(--white);
  padding: 12px 24px;
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-md);
  font-size: 0.9rem;
  pointer-events: auto;
  animation: slideDown 0.3s ease;
  max-width: 400px;
  text-align: center;
}

.toast.toast-success {
  background: var(--success);
}

.toast.toast-error {
  background: var(--danger);
}

.toast.toast-warning {
  background: var(--warning);
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-16px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== شاشة التحميل ===== */
.loading-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(255,255,255,0.9);
  z-index: 250;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

.loading-overlay.hidden {
  display: none;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid var(--gray-200);
  border-top: 4px solid var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ===== تفاصيل العضو ===== */
.member-info-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

.member-info-cards .card {
  padding: 16px;
}

.member-info-cards .card-value {
  font-size: 1.3rem;
}

/* ===== الاستجابة ===== */
@media (max-width: 768px) {
  html {
    font-size: 14px;
  }

  .app-header {
    padding: 0 12px;
  }

  .header-content {
    gap: 12px;
  }

  .main-nav {
    display: none;
    position: fixed;
    top: 60px;
    left: 0;
    right: 0;
    background: var(--primary);
    flex-direction: column;
    padding: 8px;
    box-shadow: var(--shadow-lg);
    z-index: 99;
  }

  .main-nav.open {
    display: flex;
  }

  .nav-toggle {
    display: block;
    margin-right: auto;
  }

  .app-main {
    padding: 16px;
  }

  .summary-cards {
    grid-template-columns: repeat(2, 1fr);
  }

  .dashboard-grid {
    grid-template-columns: 1fr;
  }

  .settings-grid {
    grid-template-columns: 1fr;
  }

  .report-filters {
    flex-direction: column;
    align-items: stretch;
  }

  .modal-content {
    max-width: 100%;
    margin: 10px;
  }

  table {
    font-size: 0.8rem;
  }

  thead th, tbody td {
    padding: 8px 10px;
  }
}

@media (max-width: 480px) {
  .summary-cards {
    grid-template-columns: 1fr;
  }

  .card {
    padding: 14px;
  }

  .card-value {
    font-size: 1.3rem;
  }

  .form-actions {
    flex-direction: column;
  }

  .form-actions .btn {
    width: 100%;
    justify-content: center;
  }
}

/* ===== طباعة ===== */
@media print {
  .app-header,
  .nav-toggle,
  .btn,
  .modal,
  #toast-container,
  .loading-overlay {
    display: none !important;
  }

  .app-main {
    padding: 0;
  }

  .view {
    display: block !important;
  }

  .card {
    box-shadow: none;
    border: 1px solid var(--gray-300);
  }
}
</style>
